:root{font-family:system-ui,-apple-system,sans-serif;color:#f9f4f7;background:#151a22;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:660px;margin:auto;padding:22px 16px 115px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}header{margin-bottom:24px}.logo{font-weight:850;font-size:29px;letter-spacing:-1.2px}.pink{color:#e5a5be}.muted,.hint{color:#bbb5c0}.hint{font-size:12px;line-height:1.5}.small{font-size:13px}.pill{background:#413743;color:#f0bdd1;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:750}h1{font-size:28px;margin:7px 0 15px}h2{font-size:19px;margin:20px 0 10px}h3{font-size:16px;margin:0 0 9px}.card{background:#292c37;border:1px solid #393c47;border-radius:17px;padding:16px;margin:11px 0}.subcard{background:#343641;border-radius:12px;padding:12px;margin:9px 0}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}button,input,textarea,select{font:inherit}button{border:0;border-radius:11px;padding:11px 13px;background:#e5a5be;color:#271c25;font-weight:750;cursor:pointer;min-height:42px}button.secondary{background:#454451;color:#fff}button.ghost{background:transparent;color:#e5a5be;padding:6px 8px;min-height:32px}button:disabled{opacity:.45}.wide{width:100%}.mini{font-size:12px;padding:7px 9px;min-height:32px}input,textarea,select{width:100%;background:#41404c;border:1px solid #67616f;color:white;border-radius:9px;padding:10px;min-width:0}input[type=checkbox]{width:22px;height:22px;accent-color:#e5a5be}textarea{min-height:76px;resize:vertical}label{display:block;font-size:12px;color:#c7c1cb;margin:0 0 5px}.field{min-width:0}.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 65px;gap:7px;align-items:center;margin:9px 0}.set .check{display:flex;justify-content:center}.set input{padding:9px 6px}.stat{font-size:23px;font-weight:800}.progress{height:8px;border-radius:20px;back </style></head><body><main><header><div class="logo"><span class="pink">✦</span> ninfit.</div><span class="pill">V2 · LOCAL FIRST</span></header><div id="content"><p>Loading your workouts…</p></div></main><nav class="nav"><button data-tab="workout">◉<br>Workout</button><button data-tab="schedule">▦<br>Schedule</button><button data-tab="progress">▥<br>Progress</button><button data-tab="settings">⚙<br>Settings</button></nav><script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const dateLocal=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayNum=d=>new Date(d+'T12:00:00').getDay();
const dayKeys={1:'mon',2:'tue',4:'thu',5:'fri'};
const config={mon:{title:'Back Squat',who:'Trainer'},tue:{title:'Bench Press',who:'Solo'},thu:{title:'Deadlift',who:'Trainer'},fri:{title:'Overhead Press',who:'Solo'}};
const ex=(name,targets=[10,10,10],instructions='',unit='reps')=>({id:id(),name,targets:targets.map(String),instructions,unit});
function defaults(){return {mon:{warm:[ex('MB Warm Up',['10 each','10 each','10 each'],'Lateral steps and front/back kicks'),ex('Forearm Plank',[30,30,30],'Hold for seconds','sec'),ex('Goblet Squat',[12,10,8])],main:[ex('Back Squat'),],accessory:[ex('Leg Extensions',[10,12,15]),ex('Alternating Forward Lunges',['8 each','8 each','8 each']),ex('KB Sumo Squats',[12,12,12])]},tue:{warm:[ex('RB Shoulder Warm Up',['10 each','10 each','10 each'],'Nose pulls into external rotation; band pull-aparts; bent-over straight-arm pulldowns; single-arm rotational rows; internal/external rotations'),ex('Plank Walkouts',[8,6,5]),ex('Push Ups',[8,8,8]),ex('Hollowbody Hold',[30,30,30],'Hold for seconds','sec')],main:[ex('Bench Press')],accessory:[ex('Row Machine',[12,10,8]),ex('Triceps Pushdowns',[15,15,15]),ex('DB Chest Flies',[8,8,8])]},thu:{warm:[ex('Deadbugs',[20,20,20]),ex('MB Clam Shells',['10 each','10 each','10 each']),ex('KB RDL',[8,10,12])],main:[ex('Deadlift')],accessory:[ex('Hip Thruster Machine',[8,8,8]),ex('Seated Leg Curls',[12,12,12]),ex('Single-Leg Press',['10 each','10 each','10 each'])]},fri:{warm:[ex('PVC Pass Throughs',[10,10,10]),ex('TRX YTs',[8,8,8]),ex('Plate In/Outs',[10,10,10])],main:[ex('Overhead Press')],accessory:[ex('Arnold Press',[8,10,12]),ex('Hollow Skull Crusher'),ex('Cable Lat Pulldown',[8,8,8])]}}}
let state={version:2,templates:defaults(),sessions:{},settings:{timerSeconds:60,unit:'lb',lastBackup:null}};
let tab='workout',selectedDate=dateLocal(),timerEnd=0,timerRemaining=60,timerRunning=false,dbHandle=null,saveChain=Promise.resolve();
function clone(v){return JSON.parse(JSON.stringify(v))}
function migrateV1(old){if(!old||!old.sessions)return;const mapping={Squat:'mon',Bench:'tue',Deadlift:'thu',Overhead:'fri'};for(const [date,s] of Object.entries(old.sessions)){const day=mapping[s.type]||dayKeys[dayNum(date)];if(!day)continue;const session={date,day,status:s.finished?'completed':'in-progress',sections:clone(state.templates[day]),notes:s.notes||'',createdAt:Date.now()};session.sections.warm.forEach((e,i)=>e.warmDone=!!s.warm?.[i]);[...session.sections.main,...session.sections.accessory].forEach((e,i)=>{e.sets=e.targets.map((_,j)=>{const v=s.sets?.[i+'-'+j]||{};return {weight:v.weight??'',reps:v.reps??'',rpe:'',note:'',done:!!v.done}})});state.sessions[date]=session}}
function normalize(){state.templates??=defaults();state.sessions??={};state.settings??={};state.settings.timerSeconds??=60;state.settings.unit??='lb';for(const t of Object.values(state.templates)){t.warm??=[];t.main??=[];t.accessory??=[]}for(const s of Object.values(state.sessions)){s.sections??=clone(state.templates[s.day]||defaults().tue);s.status??='in-progress';for(const section of ['warm','main','accessory']){s.sections[section]??=[];s.sections[section].forEach(e=>{e.targets??=[10,10,10];e.unit??='reps';e.instructions??='';e.sets??=e.targets.map(()=>({weight:'',reps:'',rpe:'',note:'',done:false}))})}}}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('ninfit-v2',1);r.onupgradeneeded=()=>{r.result.createObjectStore('data')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readDB(){return new Promise((resolve,reject)=>{const tx=dbHandle.transaction('data','readonly'),r=tx.objectStore('data').get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function writeDB(snapshot){return new Promise((resolve,reject)=>{const tx=dbHandle.transaction('data','readwrite');tx.objectStore('data').put(snapshot,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function save(){const snap=clone(state);saveChain=saveChain.catch(()=>{}).then(()=>writeDB(snap)).catch(err=>{console.error(err);alert('Saving failed. Please export a backup in Settings.')} );return saveChain}
async function init(){try{dbHandle=await openDB();const existing=await readDB();if(existing)state=existing;else{try{const old=JSON.parse(localStorage.getItem('ninfit-v1')||'null');if(old)migrateV1(old)}catch(e){console.warn('Legacy import skipped',e)}await save()}normalize();timerRemaining=state.settings.timerSeconds;render()}catch(e){$('#content').innerHTML=`<div class="notice">Could not open local storage. Please use Safari with normal browsing enabled. ${esc(e.message)}</div>`}}
function currentDay(){return state.sessions[selectedDate]?.day||dayKeys[dayNum(selectedDate)]||null}
function session(create=false){if(!state.sessions[selectedDate]&&create){const day=currentDay()||'tue';state.sessions[selectedDate]={date:selectedDate,day,status:'in-progress',sections:clone(state.templates[day]),notes:'',createdAt:Date.now()};normalize();save()}return state.sessions[selectedDate]||null}
function allExercises(s){return [...s.sections.warm,...s.sections.main,...s.sections.accessory]}
function total(s){return allExercises(s).reduce((a,e)=>a+(e.sets?.length||0),0)}
function done(s){return allExercises(s).reduce((a,e)=>a+(e.sets||[]).filter(v=>v.done).length,0)}
function prevFor(name,date){return Object.values(state.sessions).filter(s=>s.date<date).sort((a,b)=>b.date.localeCompare(a.date)).flatMap(s=>allExercises(s).filter(e=>e.name.trim().toLowerCase()===name.trim().toLowerCase()).map(e=>({date:s.date,sets:e.sets||[]})))[0]||null}
function render(){ $$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#content').innerHTML=({workout:workoutView,schedule:scheduleView,progress:progressView,settings:settingsView})[tab]();bind();updateTimer()}
function workoutView(){const s=session(),day=currentDay(),c=day?config[day]:null;let out=`<div class="row"><div><div class="hint">${esc(new Date(selectedDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}))}</div><h1>${c?c.title:'Rest Day'}</h1></div>${c?`<span class="pill">${c.who.toUpperCase()}</span>`:''}</div><div class="card"><label for="date">Workout date</label><input type="date" id="date" value="${selectedDate}"></div>`;
if(!day)return out+`<div class="card"><p class="muted">Scheduled recovery day. You can still log a workout if your plans change.</p><button data-action="rest-start">Start an extra session</button></div>`;
if(!s)return out+`<div class="card"><h2>Ready for ${esc(c.title)}?</h2><p class="hint">Starting copies the current template into a dated session. Future template edits won't rewrite this workout.</p><button class="wide" data-action="start">Start workout</button></div>${timerView()}`;
const count=done(s),num=total(s);out+=`<div class="grid2"><div class="card"><div class="hint">COMPLETED SETS</div><div class="stat">${count}/${num}</div></div><div class="card"><div class="hint">STATUS</div><div class="stat" style="font-size:17px">${s.status==='completed'?'Completed':s.status==='skipped'?'Skipped':'In progress'}</div></div></div><div class="progress"><div style="width:${num?100*count/num:0}%"></div></div>${timerView()}<div class="notice">Changes here affect this date only. Use <b>Schedule</b> to edit future workouts.</div>`;
for(const section of ['warm','main','accessory']){out+=`<div class="row"><h2>${{warm:'Warmup',main:'Main lift',accessory:'Accessories'}[section]}</h2><button class="ghost mini" data-add="${section}">＋ Add</button></div>`;if(!s.sections[section].length)out+='<div class="empty">No exercises yet.</div>';s.sections[section].forEach((e,i)=>{const prior=prevFor(e.name,selectedDate);out+=`<div class="card"><div class="exercise-title"><strong>${esc(e.name)}</strong><button class="ghost mini" data-edit="${section}|${i}">Edit</button></div>${e.instructions?`<p class="hint">${esc(e.instructions)}</p>`:''}${prior?`<p class="tag">Last ${esc(prior.date)}: ${prior.sets.filter(x=>x.done).map(v=>`${esc(v.weight||'BW')} × ${esc(v.reps||'—')}`).join(' · ')||'no completed sets'}</p>`:''}<div class="set hint"><span>✓</span><span>Weight (${esc(state.settings.unit)})</span><span>${e.unit==='sec'?'Seconds':'Reps'}</span><span>Target</span></div>`;e.sets.forEach((v,j)=>{out+=`<div class="set"><span class="check"><input aria-label="Complete set ${j+1}" type="checkbox" data-set="${section}|${i}|${j}|done" ${v.done?'checked':''}></span><input aria-label="Weight set ${j+1}" type="number" min="0" step="any" inputmode="decimal" placeholder="BW" data-set="${section}|${i}|${j}|weight" value="${esc(v.weight)}"><input aria-label="Actual reps set ${j+1}" type="text" inputmode="decimal" placeholder="Actual" data-set="${section}|${i}|${j}|reps" value="${esc(v.reps)}"><small class="hint right">${esc(e.targets[j]||'—')}</small></div><details><summary class="hint">Set ${j+1} · Effort / note ${v.rpe?'('+esc(v.rpe)+')':''}</summary><div class="grid2" style="margin-top:8px"><div><label>RPE (optional)</label><select data-set="${section}|${i}|${j}|rpe"><option value="">Not rated</option>${[5,5.5,6,6.5,7,7.5,8,8.5,9,9.5,10].map(n=>`<option ${String(v.rpe)===String(n)?'selected':''}>${n}</option>`).join('')}</select></div><div><label>Set note</label><input data-set="${section}|${i}|${j}|note" value="${esc(v.note)}" placeholder="Form, tempo…"></div></div></details>`});out+='</div>'})}
out+=`<div class="card"><label>Session / trainer notes</label><textarea id="sessionNotes" placeholder="Technique cues, how it felt, changes from trainer…">${esc(s.notes)}</textarea><div class="grid2" style="margin-top:12px"><button data-action="finish">${s.status==='completed'?'Reopen workout':'Finish workout'}</button><button class="secondary" data-action="skip">${s.status==='skipped'?'Reopen':'Mark skipped'}</button></div></div>`;return out}
function timerView(){return `<div class="card"><div class="row"><strong>Manual rest timer</strong><span class="tag">Never auto-starts</span></div><div id="timerDisplay" class="timer">${formatTime(timerRemaining)}</div><div class="chips" style="justify-content:center">${[30,60,90,120].map(n=>`<button class="secondary mini" data-timer-preset="${n}">${n}s</button>`).join('')}</div><div class="grid3" style="margin-top:10px"><button data-timer="start">Start</button><button class="secondary" data-timer="pause">Pause</button><button class="secondary" data-timer="reset">Reset</button></div></div>`}
function scheduleView(){let out='<h1>Workout templates</h1><p class="hint">Edit a template to change future sessions. Already-started sessions and historical results stay untouched.</p>';for(const day of ['mon','tue','thu','fri']){const t=state.templates[day],c=config[day];out+=`<div class="card"><div class="row"><div><span class="tag">${day.toUpperCase()} · ${c.who}</span><h2 style="margin:4px 0">${c.title}</h2></div></div>`;for(const section of ['warm','main','accessory']){out+=`<h3 style="margin-top:14px">${{warm:'Warmup',main:'Main lift',accessory:'Accessories'}[section]}</h3>`;t[section].forEach((e,i)=>out+=`<div class="row" style="padding:5px 0"><div class="small">${esc(e.name)} <span class="hint">· ${e.targets.length} sets</span></div><button class="ghost mini" data-template-edit="${day}|${section}|${i}">Edit</button></div>`);out+=`<button class="secondary mini" data-template-add="${day}|${section}">＋ Add exercise</button>`}out+='</div>'}return out}
function progressView(){const sessions=Object.values(state.sessions).sort((a,b)=>b.date.localeCompare(a.date)),completed=sessions.filter(s=>s.status==='completed');let out=`<h1>Your progress</h1><div class="grid2"><div class="card"><div class="hint">SESSIONS LOGGED</div><div class="stat">${sessions.length}</div></div><div class="card"><div class="hint">COMPLETED</div><div class="stat">${completed.length}</div></div></div>`;
const liftNames=Object.values(config).map(c=>c.title);out+=`<div class="card"><h3>Main lift trends</h3><label for="liftSelect">Choose a lift</label><select id="liftSelect">${liftNames.map(n=>`<option ${n===selectedLift?'selected':''}>${n}</option>`).join('')}</select>${trendChart(selectedLift)}</div><h2>Workout history</h2>`;if(!sessions.length)return out+'<div class="empty">Your first workout is waiting for you.</div>';for(const s of sessions){out+=`<div class="card"><div class="row"><strong>${esc(s.date)} · ${esc(config[s.day]?.title||'Workout')}</strong><span class="pill">${esc(s.status)}</span></div><p class="hint">${done(s)}/${total(s)} sets · ${esc(s.notes||'No notes')}</p><button class="secondary mini" data-open="${s.date}">View / edit</button></div>`}return out}
let selectedLift='Back Squat';
function trendChart(name){const data=Object.values(state.sessions).sort((a,b)=>a.date.localeCompare(b.date)).flatMap(s=>allExercises(s).filter(e=>e.name===name).map(e=>({date:s.date,max:Math.max(0,...(e.sets||[]).filter(v=>v.done&&Number(v.weight)>0).map(v=>Number(v.weight)))}))).filter(x=>x.max>0);if(!data.length)return '<p class="hint">Complete a weighted set to see your trend.</p>';const values=data.slice(-12),max=Math.max(...values.map(x=>x.max)),min=Math.min(...values.map(x=>x.max)),span=Math.max(1,max-min),pts=values.map((v,i)=>`${30+i*290/Math.max(1,values.length-1)},${130-(v.max-min)/span*100}`).join(' ');return `<svg class="chart" viewBox="0 0 350 165" role="img" aria-label="Heaviest completed working weight over time"><line x1="25" y1="135" x2="325" y2="135" stroke="#77717d"/><polyline points="${pts}" fill="none" stroke="#e5a5be" stroke-width="3"/>${values.map((v,i)=>`<circle cx="${30+i*290/Math.max(1,values.length-1)}" cy="${130-(v.max-min)/span*100}" r="4" fill="#e5a5be"/>`).join('')}<text x="26" y="154" font-size="11" fill="#c9c1cb">${values[0].date}</text><text x="323" y="154" text-anchor="end" font-size="11" fill="#c9c1cb">${values.at(-1).date}</text><text x="26" y="20" font-size="12" fill="#f9f4f7">Top: ${max} ${esc(state.settings.unit)}</text></svg>`}
function settingsView(){return `<h1>Settings & backups</h1><div class="card"><h3>Protect your workout history</h3><p class="hint">Your workouts live on this device in IndexedDB, not on GitHub. Deleting the app, clearing website data, or switching phones can erase them. Export regularly and keep a copy in Files or iCloud Drive.</p><p class="hint">Last export: ${esc(state.settings.lastBackup||'Never')}</p><div class="grid2"><button data-action="export">Export JSON</button><button class="secondary" data-action="import">Restore JSON</button></div><button class="secondary wide" style="margin-top:9px" data-action="csv">Export CSV</button><input type="file" id="restoreFile" accept=".json,application/json" class="hidden"></div><div class="card"><h3>Preferences</h3><label>Weight unit (display label only; does not convert old entries)</label><select id="weightUnit"><option ${state.settings.unit==='lb'?'selected':''}>lb</option><option ${state.settings.unit==='kg'?'selected':''}>kg</option></select><p class="hint">For dumbbell lifts, enter weight per dumbbell and note it in the exercise instructions. Main-lift trends show recorded working weight, not a calculated one-rep max.</p></div><div class="card"><h3>Installation</h3><p class="hint">After publishing on GitHub Pages, open the site in Safari, tap Share → Add to Home Screen. Once loaded online, the app can work offline. Updates may require a reload when you reconnect.</p></div><div class="notice">No cloud sync or account in v2. Never publish exported workout backups to your public GitHub repository.</div>`}
function formatTime(s){return `${Math.floor(s/60)}:${String(Math.max(0,Math.ceil(s%60))).padStart(2,'0')}`}
function updateTimer(){if(timerRunning){timerRemaining=Math.max(0,(timerEnd-Date.now())/1000);if(timerRemaining===0)timerRunning=false}const e=$('#timerDisplay');if(e)e.textContent=formatTime(timerRemaining)}
setInterval(updateTimer,250);
function editExercise(day,section,index,scope){const target=scope==='template'?state.templates[day]:session().sections;const list=target[section],existing=index===null?null:list[index];const name=prompt('Exercise name',existing?.name||'');if(name===null)return;if(!name.trim())return alert('Exercise name is required.');const targets=prompt('Target sets (comma separated, e.g. 10,10,8 or 30,30,30 for seconds)',existing?.targets.join(',')||'10,10,10');if(targets===null)return;const parsed=targets.split(',').map(x=>x.trim()).filter(Boolean);if(!parsed.length||parsed.length>20)return alert('Please enter 1–20 set targets.');const instructions=prompt('Instructions / trainer cues (optional)',existing?.instructions||'');if(instructions===null)return;const unit=confirm('Is this a time-based exercise measured in seconds?\nOK = seconds, Cancel = repetitions')?'sec':'reps';if(existing){existing.name=name.trim();existing.targets=parsed;existing.instructions=instructions;existing.unit=unit;existing.sets??=[];existing.sets=parsed.map((_,i)=>existing.sets[i]||{weight:'',reps:'',rpe:'',note:'',done:false})}else{const e=ex(name.trim(),parsed,instructions,unit);e.sets=parsed.map(()=>({weight:'',reps:'',rpe:'',note:'',done:false}));list.push(e)}save();render()}
function download(filename,body,mime){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type:mime}));a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function csv(){const rows=[['Date','Day','Status','Section','Exercise','Set','Target','Weight','Unit','Actual','RPE','Done','Set Note','Session Note']];for(const s of Object.values(state.sessions))for(const section of ['warm','main','accessory'])for(const e of s.sections[section])e.sets.forEach((v,i)=>rows.push([s.date,s.day,s.status,section,e.name,i+1,e.targets[i]||'',v.weight||'',state.settings.unit,v.reps||'',v.rpe||'',v.done?'yes':'no',v.note||'',s.notes||'']));return rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n')}
function bind(){ $$('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});$('#date')?.addEventListener('change',e=>{selectedDate=e.target.value;render()});$$('[data-action]').forEach(b=>b.onclick=async()=>{switch(b.dataset.action){case 'start':session(true);render();break;case 'rest-start':{const chosen=prompt('Workout day: mon, tue, thu, or fri','tue');if(!chosen||!config[chosen.toLowerCase()])return;state.sessions[selectedDate]={date:selectedDate,day:chosen.toLowerCase(),status:'in-progress',sections:clone(state.templates[chosen.toLowerCase()]),notes:'',createdAt:Date.now()};normalize();save();render();break}case 'finish':{const s=session();s.status=s.status==='completed'?'in-progress':'completed';save();render();break}case 'skip':{const s=session();s.status=s.status==='skipped'?'in-progress':'skipped';save();render();break}case 'export':{state.settings.lastBackup=new Date().toLocaleString();await save();download('ninfit-backup-'+dateLocal()+'.json',JSON.stringify(state,null,2),'application/json');render();break}case 'csv':download('ninfit-workouts-'+dateLocal()+'.csv',csv(),'text/csv');break;case 'import':$('#restoreFile').click();break}});
$$('[data-set]').forEach(el=>{const [section,i,j,field]=el.dataset.set.split('|');const handler=()=>{const s=session(),v=s.sections[section][Number(i)].sets[Number(j)];v[field]=field==='done'?el.checked:el.value;save();if(field==='done')render()};el.addEventListener(field==='done'||field==='rpe'?'change':'input',handler)});
$('#sessionNotes')?.addEventListener('input',e=>{session().notes=e.target.value;save()});$$('[data-add]').forEach(b=>b.onclick=()=>editExercise(currentDay(),b.dataset.add,null,'session'));$$('[data-edit]').forEach(b=>b.onclick=()=>{const [section,i]=b.dataset.edit.split('|');const action=prompt('Type EDIT to change this exercise, DELETE to remove it, UP or DOWN to reorder it.','EDIT');if(!action)return;const list=session().sections[section],n=Number(i);if(action.toUpperCase()==='DELETE'){if(confirm('Remove this exercise from today?')){list.splice(n,1);save();render()}}else if(['UP','DOWN'].includes(action.toUpperCase())){const dest=n+(action.toUpperCase()==='UP'?-1:1);if(dest>=0&&dest<list.length){[list[n],list[dest]]=[list[dest],list[n]];save();render()}}else if(action.toUpperCase()==='EDIT')editExercise(currentDay(),section,n,'session')});
$$('[data-template-add]').forEach(b=>b.onclick=()=>{const [day,section]=b.dataset.templateAdd.split('|');editExercise(day,section,null,'template')});$$('[data-template-edit]').forEach(b=>b.onclick=()=>{const [day,section,i]=b.dataset.templateEdit.split('|'),list=state.templates[day],n=Number(i);const action=prompt('Type EDIT, DELETE, UP, or DOWN. Changes affect future sessions only.','EDIT');if(!action)return;if(action.toUpperCase()==='DELETE'){if(confirm('Remove from future workouts?')){list[section].splice(n,1);save();render()}}else if(['UP','DOWN'].includes(action.toUpperCase())){const dest=n+(action.toUpperCase()==='UP'?-1:1);if(dest>=0&&dest<list[section].length){[list[section][n],list[section][dest]]=[list[section][dest],list[section][n]];save();render()}}else if(action.toUpperCase()==='EDIT')editExercise(day,section,n,'template')});
$$('[data-open]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.open;tab='workout';render();scrollTo(0,0)});$('#liftSelect')?.addEventListener('change',e=>{selectedLift=e.target.value;render()});$('#weightUnit')?.addEventListener('change',e=>{state.settings.unit=e.target.value;save();render()});$$('[data-timer-preset]').forEach(b=>b.onclick=()=>{timerRunning=false;timerRemaining=Number(b.dataset.timerPreset);state.settings.timerSeconds=timerRemaining;save();updateTimer()});$$('[data-timer]').forEach(b=>b.onclick=()=>{const action=b.dataset.timer;if(action==='start'&&!timerRunning){timerEnd=Date.now()+timerRemaining*1000;timerRunning=true}else if(action==='pause'){updateTimer();timerRunning=false}else if(action==='reset'){timerRunning=false;timerRemaining=state.settings.timerSeconds}updateTimer()});$('#restoreFile')?.addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('Backup exceeds 10 MB');const parsed=JSON.parse(await file.text());if(parsed.version!==2||!parsed.sessions||!parsed.templates||!parsed.settings||typeof parsed.sessions!=='object')throw Error('Not a valid NinFit v2 backup');if(!confirm('Replace ALL current workouts and templates with this backup? Export your current data first.'))return;state=parsed;normalize();await save();render();alert('Backup restored.')}catch(err){alert('Restore failed: '+err.message)}})}
init();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
